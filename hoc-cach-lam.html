ọc và đối xứng","title":"Tìm hình không đối xứng và đối xứng của họa tiết","src":"LMS 4.2 – Hình phẳng và đối xứng tr.12–15; CĐ4 – Hình học tr.3 C5; Tổng hợp 2 tr.4 C10","example":"Thử gấp hình theo trục dọc.","steps":[{"t":"Hình trái tim có hai nửa giống nhau.","v":"\u003csvg class=\"shape\" viewBox=\"0 0 200 180\">\u003cpath d=\"M100 150 C10 95 15 30 58 30 Q85 30 100 58 Q115 30 142 30 C185 30 190 95 100 150Z\" fill=\"#ffd2dd\" stroke=\"#db4776\" stroke-width=\"3\"/>\u003cline class=\"axis\" x1=\"100\" y1=\"12\" x2=\"100\" y2=\"168\"/>\u003c/svg>"},{"t":"Hình ghép ô vuông: so vị trí các ô ở hai bên đường ngang.","v":"\u003csvg class=\"shape\" viewBox=\"0 0 200 180\">\u003crect class=\"pop\" style=\"--i:0\" x=\"80\" y=\"30\" width=\"40\" height=\"40\" fill=\"#a7e6c0\" stroke=\"#26764c\"/>\u003crect class=\"pop\" style=\"--i:1\" x=\"120\" y=\"30\" width=\"40\" height=\"40\" fill=\"#a7e6c0\" stroke=\"#26764c\"/>\u003crect class=\"pop\" style=\"--i:2\" x=\"40\" y=\"70\" width=\"40\" height=\"40\" fill=\"#a7e6c0\" stroke=\"#26764c\"/>\u003crect class=\"pop\" style=\"--i:3\" x=\"80\" y=\"70\" width=\"40\" height=\"40\" fill=\"#a7e6c0\" stroke=\"#26764c\"/>\u003crect class=\"pop\" style=\"--i:4\" x=\"120\" y=\"70\" width=\"40\" height=\"40\" fill=\"#a7e6c0\" stroke=\"#26764c\"/>\u003crect class=\"pop\" style=\"--i:5\" x=\"80\" y=\"110\" width=\"40\" height=\"40\" fill=\"#a7e6c0\" stroke=\"#26764c\"/>\u003crect class=\"pop\" style=\"--i:6\" x=\"120\" y=\"110\" width=\"40\" height=\"40\" fill=\"#a7e6c0\" stroke=\"#26764c\"/>\u003cline class=\"axis\" x1=\"20\" y1=\"90\" x2=\"180\" y2=\"90\"/>\u003c/svg>"},{"t":"Nếu gấp mà hai nửa không trùng nhau thì đường đó không phải trục đối xứng.","v":"\u003csvg class=\"shape\" viewBox=\"0 0 200 180\">\u003cpath d=\"M35 35 H135 L165 65 V145 H35Z\" fill=\"#cfe9ff\" stroke=\"#2563eb\" stroke-width=\"3\"/>\u003cline class=\"axis\" x1=\"100\" y1=\"10\" x2=\"100\" y2=\"170\"/>\u003c/svg>\u003cdiv class=\"equation\">Hai nửa không trùng nhau\u003c/div>"}]}];let i=0,j=0,timer=null;const $=x=>document.getElementById(x);let seen=new Set;try{seen=new Set(JSON.parse(localStorage.getItem('math-tutorial-seen')||'[]'))}catch{}function stop(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='▶ Tự động'}function render(){const l=lessons[i],s=l.steps[j];$('counter').textContent='Dạng '+(i+1)+'/'+lessons.length+' · Bước '+(j+1)+'/'+l.steps.length;$('title').textContent=l.title;$('example').textContent='Ví dụ: '+l.example;$('visual').innerHTML=s.v;$('explain').textContent=s.t;$('source').textContent='Nguồn dạng bài: '+l.src;$('progress').style.width=(100*(j+1)/l.steps.length)+'%';$('back').disabled=j===0;$('next').disabled=j===l.steps.length-1;$('prevLesson').disabled=i===0;$('nextLesson').disabled=i===lessons.length-1;if(j===l.steps.length-1){seen.add(i);try{localStorage.setItem('math-tutorial-seen',JSON.stringify([...seen]))}catch{}}}function show(n){stop();i=n;j=0;$('catalog').hidden=true;$('player').hidden=false;render();window.scrollTo(0,0)}function catalog(){stop();$('player').hidden=true;$('catalog').hidden=false;$('summary').textContent=lessons.length+' dạng bài · Đã xem '+seen.size+'/'+lessons.length;const root=$('topics');root.replaceChildren();for(const cat of [...new Set(lessons.map(l=>l.cat))]){const box=document.createElement('section');box.className='topic';const h=document.createElement('h3');h.textContent=cat;box.append(h);const tiles=document.createElement('div');tiles.className='tiles';lessons.forEach((l,n)=>{if(l.cat!==cat)return;const b=document.createElement('button');b.className='tile';b.textContent=(seen.has(n)?'✓ ':'')+(n+1)+'. '+l.title;b.onclick=()=>show(n);tiles.append(b)});box.append(tiles);root.append(box)}window.scrollTo(0,0)}$('menu').onclick=catalog;$('back').onclick=()=>{stop();if(j>0){j--;render()}};$('next').onclick=()=>{stop();if(j<lessons[i].steps.length-1){j++;render()}};$('replay').onclick=()=>{stop();j=0;render()};$('prevLesson').onclick=()=>{if(i>0)show(i-1)};$('nextLesson').onclick=()=>{if(i<lessons.length-1)show(i+1)};$('play').onclick=()=>{if(timer!==null){stop();return}if(j===lessons[i].steps.length-1){j=0;render()}$('play').textContent='⏸ Tạm dừng';timer=setInterval(()=>{if(j<lessons[i].steps.length-1){j++;render()}else stop()},4500)};catalog();</script></body></html>
